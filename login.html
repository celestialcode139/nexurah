<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CMS Login - Optina</title>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <script src="/js/auth.js"></script>
    <script>
      // Redirect to CMS if already authenticated
      Auth.redirectIfAuthenticated();
    </script>
    <style>
      :root {
        --bg-color: #0b0c10;
        --card-bg: #1f2833;
        --primary-color: #66fcf1;
        --text-color: #c5c6c7;
        --border-color: #45a29e;
        --error-color: #ff4b4b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .login-container {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        text-align: center;
        animation: fadeIn 0.5s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .login-title {
        font-size: 24px;
        color: #fff;
        margin-top: 0;
        margin-bottom: 24px;
      }
      .login-input {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 16px;
        background-color: rgba(0, 0, 0, 0.2);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .login-input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(102, 252, 241, 0.2);
      }
      .login-btn {
        width: 100%;
        padding: 12px;
        background-color: var(--primary-color);
        color: #000;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
      }
      .login-btn:hover {
        background-color: #45a29e;
      }
      .login-btn:active {
        transform: translateY(2px);
      }
      .login-error {
        color: var(--error-color);
        font-size: 14px;
        margin-top: -8px;
        margin-bottom: 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h1 class="login-title">CMS Login</h1>
      <form id="login-form">
        <input type="password" id="password" class="login-input" placeholder="Enter Password" required autofocus />
        <div id="error-message" class="login-error">Invalid password. Please try again.</div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const password = document.getElementById('password').value;
        const errorMessage = document.getElementById('error-message');
        
        if (Auth.login(password)) {
          errorMessage.style.display = 'none';
          // Redirect to CMS
          window.location.href = '/blog-cms.html';
        } else {
          errorMessage.style.display = 'block';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      });
    </script>
  </body>
</html>
