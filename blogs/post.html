<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blog Post | Optina</title>
    <meta content="Blog post" name="description" />
    <meta content="Blog Post | Optina" property="og:title" />
    <meta content="Blog post" property="og:description" />
    <meta content="" property="og:image" />
    <meta content="Blog Post | Optina" name="twitter:title" />
    <meta content="Blog post" name="twitter:description" />
    <meta content="" name="twitter:image" />
    <meta property="og:type" content="article" />
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link
      href="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/css/optina.webflow.shared.a9a628f3c.css"
      rel="stylesheet"
      type="text/css"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script>
      WebFont.load({
        google: { families: ["Inter:300,400,500,600,700", "Manrope:300,400,500,600,700"] },
      });
    </script>
    <script type="module" src="/js/components/app-header.js"></script>
    <script type="module" src="/js/components/app-footer.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <main data-blog-single>
      <section class="blog-details-page">
        <div class="w-layout-blockcontainer container w-container">
          <div class="blog-details-box-top">
            <h1 class="blog-details-title" data-blog-title>Loading...</h1>
          </div>
        </div>
        <div class="blog-details-top">
          <img
            data-blog-hero
            src=""
            loading="lazy"
            alt=""
            sizes="100vw"
            class="blog-details-image"
          />
        </div>
        <div class="blog-details-bottom">
          <div class="blog-container">
            <div class="blog-authore-box">
              <div class="blog-authore-box-left">
                <img
                  data-blog-author-image
                  src=""
                  loading="lazy"
                  alt="Author"
                  class="blog-authore-img"
                />
                <div class="blog-author-info">
                  <div class="blog-author-name" data-blog-author-name>Author</div>
                  <div class="blog-author-post" data-blog-author-role>Role</div>
                </div>
              </div>
              <div class="blog-authore-box-right">
                <div class="time">Time</div>
                <div class="time-time" data-blog-read-time>5 min read</div>
              </div>
            </div>
            <div class="blog-bottom">
              <div class="blog-bottom-data">
                <div class="blog-bottom-left">
                  <div class="blog-media-box">
                    <div class="share-blo">Explore our social media</div>
                    <div class="blog-media">
                      <a href="https://www.facebook.com/pixoora/" target="_blank" class="blog-media-link w-inline-block">
                        <img src="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/69dc62aeae338d15540037a1_facebook-01.svg" loading="lazy" alt="Facebook" />
                      </a>
                      <a href="https://linkedin.com/company/pixora-agency" target="_blank" class="blog-media-link w-inline-block">
                        <img src="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/69dc62ae210471be2c6f48d9_linkedin-01.svg" loading="lazy" alt="LinkedIn" />
                      </a>
                      <a href="https://x.com/pixoora" target="_blank" class="blog-media-link w-inline-block">
                        <img src="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/69dc62ed905d5517487f4b38_new-twitter-rectangle.svg" loading="lazy" alt="X" />
                      </a>
                    </div>
                  </div>
                </div>
                <div class="blog-bottom-right">
                  <div class="blog-details w-richtext" data-blog-content>
                    <p>Loading content...</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="blog-section-page">
        <div class="w-layout-blockcontainer container w-container">
          <div class="blog-block">
            <div class="blog-title-box">
              <div class="subtitle-box two">
                <div class="subtitle-point"></div>
                <div class="subtitle-text">Blogs</div>
              </div>
              <div class="title-with-button">
                <div class="title-box">
                  <h2 class="section-title">Our more insights</h2>
                </div>
                <div class="title-button-box">
                  <a href="/blog.html" class="primary-button w-inline-block">
                    <div class="text-box-button">
                      <div class="front-text-button">View All Blog</div>
                      <div class="back-text-button">View All Blog</div>
                    </div>
                    <div class="box-icon-button">
                      <img alt="Button Icon" src="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/69ccb71d3d6d5fbb07e6dbbb_arrow.svg" class="button-icon-front" />
                      <img alt="Button Icon" src="https://cdn.prod.website-files.com/69ccb71d3d6d5fbb07e6db17/69ccb71d3d6d5fbb07e6dbbb_arrow.svg" class="button-icon-back" />
                    </div>
                  </a>
                </div>
              </div>
            </div>
            <div class="blog-post-two" data-blog-related></div>
          </div>
        </div>
      </section>
    </main>
    <app-footer></app-footer>

    <script src="/js/blog-data.js"></script>
    <script src="/js/blog-renderer.js"></script>
    <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.2.3/dist/lenis.css" />
    <script src="https://unpkg.com/lenis@1.2.3/dist/lenis.min.js"></script>
    <script>
      if (typeof Lenis !== "undefined" && typeof $ !== "undefined") {
        let lenis = new Lenis({ lerp: 0.1, wheelMultiplier: 0.7 });
        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
      }
    </script>
  </body>
</html>
